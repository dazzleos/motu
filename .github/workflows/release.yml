# Tests and builds Motu on every push and pull request. On pushes to the
# default branch it publishes its archive, icon, screenshot and catalogue
# (apps.json) as the "latest" release: one of the sources Dazzle's
# catalogue lists, from which Settings installs and updates Motu.
name: Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Zig as Dazzle's scripts/zig pins it. Dazzle itself is fetched as
      # build.zig.zon pins it.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Test
        run: zig build test --summary new

      # Signed with the key Dazzle's apps are (and Settings trusts).
      - name: Build
        env:
          DAZZLE_SIGNING_KEY: ${{ secrets.DAZZLE_SIGNING_KEY }}
        run: |
          zig build
          ls -l zig-out/apps

      - uses: actions/upload-artifact@v4
        with:
          name: motu
          path: zig-out/apps/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: motu
          path: dist

      # One release, "latest", replaced by each build: Dazzle's catalogue
      # lists its download link, which stays the same.
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "The latest build of Motu, from commit $short ($(date -u +%Y-%m-%d)). Install it from Settings, Software, on Dazzle." > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" --title "Motu (latest build, $short)" \
            --notes-file notes.md --latest

      # Each build also as a release of its own, tagged by its commit,
      # which the store (dazzleos/store) lists: its files stay as they are
      # (the latest release's are replaced by the next build's). The ten
      # newest are kept.
      - name: A release of this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag="build-$short"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" --title "Motu (build $short)" \
            --notes "The build of Motu from commit $short, as dazzleos/store lists it." --latest=false
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  # The snap, for Linux (see snap/snapcraft.yaml): built for both
  # architectures, and kept as the run's artifacts.
  snap:
    needs: build # nothing is packed unless the tests pass
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: motu-snap-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}
